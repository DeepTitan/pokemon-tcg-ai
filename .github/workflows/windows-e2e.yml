name: Trace Windows E2E

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-e2e
      - codex/windows-capture-release

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Test tracker reducer and review engine
        run: npm run tracker:test

      - name: Test live capture transport and immediate match registration
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Windows NSIS package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TRACE_SYNC_API_URL: ${{ vars.TRACE_SYNC_API_URL }}
        run: npm run tauri:build -- --bundles nsis

      - name: Exercise crash-safe Windows route cleanup
        shell: pwsh
        run: |
          $hostsPath = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          $traceExe = Resolve-Path 'src-tauri\target\release\match-lens.exe'
          $originalHosts = [IO.File]::ReadAllText($hostsPath)
          $gameHost = 'api.us-east-1.studio-prod.pokemon.com'
          try {
            $legacy = "$originalHosts`r`n# Match Lens local capture begin`r`n127.0.0.1 $gameHost`r`n# Match Lens local capture end`r`n"
            [IO.File]::WriteAllText($hostsPath, $legacy)
            $cleanup = Start-Process -FilePath $traceExe -ArgumentList '--trace-route-cleanup' -Wait -PassThru
            if ($cleanup.ExitCode -ne 0) { throw "Cleanup helper exited $($cleanup.ExitCode)." }
            $afterCleanup = [IO.File]::ReadAllText($hostsPath)
            if ($afterCleanup.Contains($gameHost) -or $afterCleanup.Contains('Match Lens local capture')) {
              throw 'Generic recovery left the legacy game route behind.'
            }

            $session = [Guid]::NewGuid().ToString()
            $guarded = "$originalHosts`r`n# Match Lens local capture begin $session`r`n127.0.0.1 $gameHost`r`n# Match Lens local capture end $session`r`n"
            [IO.File]::WriteAllText($hostsPath, $guarded)
            $parent = Start-Process -FilePath "$env:SystemRoot\System32\timeout.exe" -ArgumentList '/T', '2', '/NOBREAK' -WindowStyle Hidden -PassThru
            $watchdog = Start-Process -FilePath $traceExe -ArgumentList '--trace-route-watchdog', $parent.Id, $session -WindowStyle Hidden -PassThru
            $parent.WaitForExit()
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            do {
              Start-Sleep -Milliseconds 200
              $afterCrash = [IO.File]::ReadAllText($hostsPath)
            } while ($afterCrash.Contains($session) -and [DateTime]::UtcNow -lt $deadline)
            if ($afterCrash.Contains($session) -or $afterCrash.Contains($gameHost)) {
              throw 'The out-of-process watchdog left the game route behind.'
            }
            if (-not $watchdog.WaitForExit(5000)) {
              $watchdog.Kill()
              throw 'The route watchdog did not exit after cleanup.'
            }
          } finally {
            [IO.File]::WriteAllText($hostsPath, $originalHosts)
            ipconfig.exe /flushdns | Out-Null
          }

      - name: Upload Windows package and executable
        uses: actions/upload-artifact@v4
        with:
          name: trace-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/match-lens.exe
            src-tauri/target/release/bundle/nsis/*.exe
