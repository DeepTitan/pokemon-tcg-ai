name: Trace Windows signing smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect Azure signing resource health
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          # Diagnostics are read-only. A signer may lack ARM read permissions;
          # report that explicitly and still exercise the actual signing request.
          $PSNativeCommandUseErrorActionPreference = $false
          function Read-AzureHealth([string]$Label, [string]$Url, [string]$Query) {
            Write-Host "::group::$Label"
            az rest --method get --url $Url --query $Query --output json --only-show-errors
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "$Label could not be read with the existing signing identity (exit $LASTEXITCODE)."
            }
            Write-Host '::endgroup::'
          }
          $subscription = "/subscriptions/$env:AZURE_SUBSCRIPTION_ID"
          $account = "$subscription/resourceGroups/trace-app-signing/providers/Microsoft.CodeSigning/codeSigningAccounts/$env:AZURE_ARTIFACT_SIGNING_ACCOUNT"
          Read-AzureHealth 'Subscription' "https://management.azure.com${subscription}?api-version=2022-12-01" '{state:state}'
          Read-AzureHealth 'Signing provider' "https://management.azure.com${subscription}/providers/Microsoft.CodeSigning?api-version=2021-04-01" '{registrationState:registrationState}'
          Read-AzureHealth 'Signing account' "https://management.azure.com${account}?api-version=2025-10-13" '{location:location,provisioningState:properties.provisioningState,accountUri:properties.accountUri,sku:properties.sku.name}'
          Read-AzureHealth 'Certificate profile' "https://management.azure.com${account}/certificateProfiles/${env:AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE}?api-version=2025-10-13" '{provisioningState:properties.provisioningState,status:properties.status,profileType:properties.profileType,certificates:properties.certificates[].{status:status,createdDate:createdDate,expiryDate:expiryDate}}'
          try {
            $timestamp = Invoke-WebRequest 'http://timestamp.acs.microsoft.com' -TimeoutSec 30
            Write-Host "Timestamp service HTTP status: $($timestamp.StatusCode)"
          } catch {
            Write-Warning "Timestamp service health probe failed: $($_.Exception.Message)"
          }
          exit 0

      - name: Build, sign, and verify a Windows executable
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $endpoint = [Uri]$env:AZURE_ARTIFACT_SIGNING_ENDPOINT
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -File |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw 'A Windows x64 SignTool installation is required.'
          }
          if ([version]$signTool.Directory.Parent.Name -lt [version]'10.0.26100.0') {
            throw 'Windows SDK 10.0.26100.0 or newer is required for Artifact Signing.'
          }

          $clientRoot = Join-Path $env:RUNNER_TEMP 'artifact-signing-client'
          $clientArchive = Join-Path $env:RUNNER_TEMP 'artifact-signing-client.zip'
          Invoke-WebRequest `
            -Uri 'https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/1.0.146' `
            -OutFile $clientArchive
          Expand-Archive -LiteralPath $clientArchive -DestinationPath $clientRoot -Force

          $env:SIGNTOOL_PATH = $signTool.FullName
          $env:ARTIFACT_SIGNING_DLIB = Join-Path $clientRoot 'bin\x64\Azure.CodeSigning.Dlib.dll'
          $env:ARTIFACT_SIGNING_METADATA = Join-Path $env:RUNNER_TEMP 'trace-artifact-signing-metadata.json'
          @{
            Endpoint = $endpoint.AbsoluteUri.TrimEnd('/')
            CodeSigningAccountName = $env:AZURE_ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE
            ExcludeCredentials = @(
              'EnvironmentCredential'
              'WorkloadIdentityCredential'
              'ManagedIdentityCredential'
              'SharedTokenCacheCredential'
              'VisualStudioCredential'
              'VisualStudioCodeCredential'
              'AzurePowerShellCredential'
              'AzureDeveloperCliCredential'
              'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json -Depth 5 | Set-Content `
            -Path $env:ARTIFACT_SIGNING_METADATA `
            -Encoding utf8NoBOM

          $projectRoot = Join-Path $env:RUNNER_TEMP 'trace-signing-smoke'
          dotnet new console --framework net8.0 --output $projectRoot
          dotnet publish $projectRoot `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output (Join-Path $projectRoot 'publish')
          $executable = Join-Path $projectRoot 'publish\trace-signing-smoke.exe'
          & ./scripts/release/sign-windows-artifact.ps1 -File $executable

          $signature = Get-AuthenticodeSignature $executable
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
            throw "Invalid Authenticode signature: $($signature.StatusMessage)"
          }
          if (-not $signature.SignerCertificate.Verify()) {
            throw 'The Artifact Signing certificate chain is not trusted by Windows.'
          }
          & $env:SIGNTOOL_PATH verify /pa /all /v $executable
          if ($LASTEXITCODE -ne 0) {
            throw 'SignTool verification failed.'
          }

          @(
            '### Artifact Signing smoke test',
            '',
            '- GitHub OIDC authentication: passed',
            '- Artifact Signing request: passed',
            '- Authenticode signature: valid',
            '- Publisher certificate chain: trusted by Windows',
            "- Publisher: $($signature.SignerCertificate.Subject)"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
