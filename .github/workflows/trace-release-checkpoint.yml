name: Trace release checkpoint

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ (contains(github.event.head_commit.message, '[MAJOR]') || contains(github.event.head_commit.message, '[MINOR]') || contains(github.event.head_commit.message, '[PATCH]')) && 'trace-release' || github.run_id }}
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    outputs:
      shouldRelease: ${{ steps.release.outputs.shouldRelease }}
      releaseLevel: ${{ steps.release.outputs.releaseLevel }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      releaseNote: ${{ steps.release.outputs.releaseNote }}
      commitSha: ${{ steps.release.outputs.commitSha }}
      releaseDraft: ${{ steps.release-state.outputs.releaseDraft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release marker
        id: release
        run: node scripts/release/trace-release-checkpoint.mjs --github-output --json

      - name: Validate release tag
        if: steps.release.outputs.shouldRelease == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.commitSha }}
        run: |
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            existing_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$existing_sha" = "$RELEASE_SHA" || {
              echo "::error::${RELEASE_TAG} already belongs to ${existing_sha}."
              exit 1
            }
          fi

      - name: Resolve GitHub release state
        id: release-state
        if: steps.release.outputs.shouldRelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null)"; then
            echo "releaseDraft=$(jq -r .isDraft <<< "$release_json")" >> "$GITHUB_OUTPUT"
          else
            echo "releaseDraft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip ordinary commit
        if: steps.release.outputs.shouldRelease != 'true'
        run: echo "No [PATCH], [MINOR], or [MAJOR] marker found on HEAD."

  build:
    name: Build ${{ matrix.name }}
    needs: checkpoint
    if: needs.checkpoint.outputs.shouldRelease == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: macOS Apple silicon
            platform: macos-latest
            rustTargets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg,app
          - name: Windows x64
            platform: windows-latest
            rustTargets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rustTargets }}

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Apply checkpoint version
        run: node scripts/release/set-trace-version.mjs "${{ needs.checkpoint.outputs.version }}"

      - name: Require automatic backup endpoint
        env:
          TRACE_SYNC_API_URL: ${{ vars.TRACE_SYNC_API_URL }}
        run: node -e "const value=process.env.TRACE_SYNC_API_URL; if (!value || new URL(value).protocol !== 'https:') throw new Error('TRACE_SYNC_API_URL must be a configured HTTPS endpoint')"

      - name: Run Windows capture integration tests
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Validate Apple notarization access
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            test -n "${!name}" || {
              echo "::error::Missing required Apple release secret: $name"
              exit 1
            }
          done

          if ! xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json >/dev/null; then
            echo "::error::Apple notarization credentials were rejected."
            exit 1
          fi

      - name: Import Developer ID certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/trace-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/trace-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$signing_identity" || {
            echo "::error::The imported certificate has no valid Developer ID Application identity."
            exit 1
          }
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Build and upload signed update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TRACE_SYNC_API_URL: ${{ vars.TRACE_SYNC_API_URL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Trace v__VERSION__
          releaseBody: |
            ${{ needs.checkpoint.outputs.releaseNote }}

            Release level: ${{ needs.checkpoint.outputs.releaseLevel }}
            Commit: ${{ needs.checkpoint.outputs.commitSha }}
          releaseDraft: ${{ needs.checkpoint.outputs.releaseDraft }}
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: "[name]_[arch][setup].[ext]"
          args: ${{ matrix.args }}

      - name: Verify signed download on a clean Mac install path
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bundle_root="src-tauri/target/${{ matrix.rustTargets }}/release/bundle"
          app_path="$bundle_root/macos/Trace.app"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          test -d "$app_path" || {
            echo "::error::Missing signed Trace.app bundle."
            exit 1
          }
          test -f "$dmg_path" || {
            echo "::error::Missing signed Trace DMG."
            exit 1
          }

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_report="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          grep -Fq 'Authority=Developer ID Application:' <<< "$signature_report"
          grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature_report"
          xcrun stapler validate "$dmg_path"
          spctl -a -vv -t open --context context:primary-signature "$dmg_path"

          fresh_root="$(mktemp -d "$RUNNER_TEMP/trace-fresh-install.XXXXXX")"
          fresh_dmg="$fresh_root/Trace.dmg"
          mount_path="$fresh_root/mount"
          install_path="$fresh_root/Applications"
          mkdir "$mount_path" "$install_path"
          ditto "$dmg_path" "$fresh_dmg"
          xattr -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");GitHub_Actions;https://github.com/$GITHUB_REPOSITORY" \
            "$fresh_dmg"

          hdiutil verify "$fresh_dmg"
          hdiutil attach "$fresh_dmg" \
            -readonly \
            -nobrowse \
            -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path" >/dev/null 2>&1 || true' EXIT

          fresh_app="$install_path/Trace.app"
          ditto "$mount_path/Trace.app" "$fresh_app"
          xattr -r -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");GitHub_Actions;https://github.com/$GITHUB_REPOSITORY" \
            "$fresh_app"
          spctl -a -vv -t exec "$fresh_app"

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$fresh_app/Contents/Info.plist")"
          executable_path="$fresh_app/Contents/MacOS/$executable_name"
          "$executable_path" >"$fresh_root/trace-launch.log" 2>&1 &
          trace_pid=$!
          sleep 5
          if ! kill -0 "$trace_pid" 2>/dev/null; then
            cat "$fresh_root/trace-launch.log"
            echo "::error::Trace did not remain running after a clean DMG install."
            exit 1
          fi
          kill "$trace_pid"
          wait "$trace_pid" || true

          {
            echo '### macOS distribution verification'
            echo
            echo '- Developer ID signature: accepted'
            echo '- Apple notarization ticket: stapled and valid'
            echo '- Quarantined DMG: accepted by Gatekeeper'
            echo '- Freshly copied app: accepted by Gatekeeper'
            echo '- Freshly copied app: launched successfully'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing keychain
        if: always() && matrix.platform == 'macos-latest'
        run: |
          security delete-keychain "$RUNNER_TEMP/trace-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/trace-signing-certificate.p12"

  publish:
    needs: [checkpoint, build]
    if: needs.checkpoint.outputs.shouldRelease == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: |
          npm ci --ignore-scripts
          sudo apt-get update
          sudo apt-get install --yes minisign

      - name: Sign uploaded assets and assemble network update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checkpoint.outputs.tag }}
          RELEASE_VERSION: ${{ needs.checkpoint.outputs.version }}
          RELEASE_NOTE: ${{ needs.checkpoint.outputs.releaseNote }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mac_asset="Trace_aarch64.app.tar.gz"
          mac_signature_asset="${mac_asset}.sig"
          windows_asset="Trace_x64-setup.exe"
          windows_signature_asset="${windows_asset}.sig"

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' > release-assets.txt
          for asset in Trace_aarch64.dmg "$mac_asset" "$windows_asset"; do
            grep -Fx "$asset" release-assets.txt >/dev/null || {
              echo "::error::Missing release asset: $asset"
              exit 1
            }
          done

          mkdir updater-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$mac_asset" \
            --pattern "$windows_asset" \
            --dir updater-assets

          npx tauri signer sign "updater-assets/$mac_asset"
          npx tauri signer sign "updater-assets/$windows_asset"

          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json \
            | base64 --decode > updater-assets/trace-updater.pub
          base64 --decode < "updater-assets/$mac_signature_asset" \
            > "updater-assets/$mac_signature_asset.minisig"
          base64 --decode < "updater-assets/$windows_signature_asset" \
            > "updater-assets/$windows_signature_asset.minisig"

          minisign -Vm "updater-assets/$mac_asset" \
            -p updater-assets/trace-updater.pub \
            -x "updater-assets/$mac_signature_asset.minisig"
          minisign -Vm "updater-assets/$windows_asset" \
            -p updater-assets/trace-updater.pub \
            -x "updater-assets/$windows_signature_asset.minisig"

          gh release upload "$RELEASE_TAG" \
            "updater-assets/$mac_signature_asset" \
            "updater-assets/$windows_signature_asset" \
            --repo "$GITHUB_REPOSITORY" --clobber

          mac_signature="$(tr -d '\r\n' < "updater-assets/$mac_signature_asset")"
          windows_signature="$(tr -d '\r\n' < "updater-assets/$windows_signature_asset")"
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg notes "$RELEASE_NOTE" \
            --arg pubDate "$published_at" \
            --arg macUrl "$base_url/$mac_asset" \
            --arg macSignature "$mac_signature" \
            --arg windowsUrl "$base_url/$windows_asset" \
            --arg windowsSignature "$windows_signature" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pubDate,
              platforms: {
                "darwin-aarch64": { url: $macUrl, signature: $macSignature },
                "darwin-aarch64-app": { url: $macUrl, signature: $macSignature },
                "windows-x86_64": { url: $windowsUrl, signature: $windowsSignature },
                "windows-x86_64-nsis": { url: $windowsUrl, signature: $windowsSignature }
              }
            }' > latest.json

          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg baseUrl "$base_url/" \
            '.version == $version
             and ((.platforms | keys | sort) == ["darwin-aarch64", "darwin-aarch64-app", "windows-x86_64", "windows-x86_64-nsis"])
             and all(.platforms[]; (.signature | length) > 20)
             and all(.platforms[]; .url | startswith($baseUrl))' \
            latest.json >/dev/null
          gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checkpoint.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Verify network update manifest
        env:
          RELEASE_TAG: ${{ needs.checkpoint.outputs.tag }}
          RELEASE_VERSION: ${{ needs.checkpoint.outputs.version }}
        run: |
          manifest="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/latest.json"
          curl --fail --silent --show-error --location "$manifest" --output latest.json
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg baseUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
            '.version == $version
             and ((.platforms | keys | sort) == ["darwin-aarch64", "darwin-aarch64-app", "windows-x86_64", "windows-x86_64-nsis"])
             and all(.platforms[]; (.signature | length) > 20)
             and all(.platforms[]; .url | startswith($baseUrl))' \
            latest.json >/dev/null
