name: Build Trace for Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to update
        required: true
        default: v0.1.17
      source_asset:
        description: Source archive attached to the release
        required: true
        default: trace-source-0.1.17.tar.gz

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release automation
        uses: actions/checkout@v4

      - name: Download the prepared Trace source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset }}
        run: gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:SOURCE_ASSET --dir .

      - name: Unpack source
        shell: pwsh
        env:
          SOURCE_ASSET: ${{ inputs.source_asset }}
        run: |
          New-Item -ItemType Directory -Path trace-source | Out-Null
          tar -xzf $env:SOURCE_ASSET -C trace-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trace-source/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: trace-source/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: trace-source
        # The tracker does not use TensorFlow. Skip unrelated native install
        # scripts from the larger research workspace when packaging Trace.
        run: npm ci --ignore-scripts

      - name: Build the Windows installer
        working-directory: trace-source
        run: npm run tauri:build -- --bundles nsis

      - name: Publish the installer to the release
        shell: pwsh
        working-directory: trace-source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "The NSIS installer was not produced." }
          Copy-Item $installer.FullName "Trace_0.1.17_x64-setup.exe"
          gh release upload $env:RELEASE_TAG "Trace_0.1.17_x64-setup.exe" --repo $env:GITHUB_REPOSITORY --clobber
