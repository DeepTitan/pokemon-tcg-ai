<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" role="img" aria-labelledby="title description">
  <title id="title">Turnlume match archive</title>
  <desc id="description">Three abstract match records connected by a glowing turn path</desc>
  <defs>
    <linearGradient id="turnlume-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f5ead2"/>
    </linearGradient>
    <linearGradient id="turnlume-path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e08a18"/>
      <stop offset="1" stop-color="#ffd95b"/>
    </linearGradient>
    <filter id="turnlume-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="turnlume-shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4d3b27" flood-opacity=".18"/>
    </filter>
  </defs>
  <circle cx="99" cy="69" r="61" fill="#fff2bd" opacity=".72"/>
  <g filter="url(#turnlume-shadow)">
    <rect x="34" y="29" width="76" height="96" rx="15" fill="#9ac8d5" transform="rotate(-11 72 77)"/>
    <rect x="76" y="23" width="76" height="96" rx="15" fill="#8cb696" transform="rotate(10 114 71)"/>
    <rect x="52" y="20" width="78" height="105" rx="16" fill="url(#turnlume-card)" stroke="#1f4c64" stroke-width="3"/>
  </g>
  <path d="M78 45h27M78 57h19" fill="none" stroke="#92a6ae" stroke-linecap="round" stroke-width="4"/>
  <path d="M74 98c7-4 5-17 16-19 12-3 9-17 20-21" fill="none" stroke="#1f4c64" stroke-linecap="round" stroke-width="5"/>
  <circle cx="75" cy="99" r="6" fill="#75a582" stroke="#fffdf7" stroke-width="3"/>
  <circle cx="90" cy="79" r="6" fill="#76a7c5" stroke="#fffdf7" stroke-width="3"/>
  <circle cx="110" cy="58" r="8" fill="url(#turnlume-path)" stroke="#fffdf7" stroke-width="3" filter="url(#turnlume-glow)"/>
  <path d="M116 49l7-7M119 58h10M115 67l7 7" fill="none" stroke="#e08a18" stroke-linecap="round" stroke-width="3"/>
</svg>
