<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opponent card pool preview</title></head><body>
<div id="root"></div><script type="module">
import React, {useState} from 'react';
import {createRoot} from 'react-dom/client';
import {PlayerDecklist} from '../PlayerDecklist.tsx';
import fixture from './fixtures/captured-decklist.json';
import '../tracker.css';
const catalog = new Map(fixture.cards.map(c => [c.id, {...c, imageDataUrl: `/api/turnlume/card-art/${c.id}.png`}]));
const pool = {source:'startup-card-pool',playerId:'other',playerName:'Opponent',cards:fixture.deck.cards.slice(0,8).map(c=>({cardId:c.cardId,name:catalog.get(c.cardId)?.name||c.cardId}))};
function Preview() {
 const [enabled,setEnabled]=useState(true), [delayed,setDelayed]=useState(false);
 return React.createElement('main',{style:{padding:40}},
  React.createElement('p',null,'Synthetic hover fixture: unknown quantities must never render copy controls or copy-count badges.'),
  React.createElement('button',{onClick:()=>setEnabled(v=>!v)},enabled?'Revoke preview':'Grant preview'),
  React.createElement('button',{onClick:()=>setDelayed(v=>!v)},delayed?'Load immediately':'Delay load'),
  React.createElement('div',{style:{marginTop:24,display:'flex',gap:40}},
   React.createElement(PlayerDecklist,{name:'Opponent',catalog,accessKey:String(enabled),loadDeck:async()=>{await new Promise(r=>setTimeout(r,delayed?3000:50));if(!enabled)throw new Error('This match has no complete opponent decklist saved.');return pool;}}),
   React.createElement(PlayerDecklist,{name:'Complete capture',catalog,deck:fixture.deck})));
}
createRoot(document.getElementById('root')).render(React.createElement(Preview));
</script></body></html>
