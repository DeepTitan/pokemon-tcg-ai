<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="trace-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf7fc"/>
      <stop offset="1" stop-color="#d8eaf4"/>
    </linearGradient>
    <radialGradient id="trace-glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fff8d7" stop-opacity=".92"/>
      <stop offset="1" stop-color="#f5d96f" stop-opacity="0"/>
    </radialGradient>
    <filter id="trace-shadow" x="-30%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#274a5d" flood-opacity=".2"/>
    </filter>
    <clipPath id="trace-mask">
      <rect width="1024" height="1024" rx="226"/>
    </clipPath>
  </defs>
  <g clip-path="url(#trace-mask)">
    <rect width="1024" height="1024" fill="url(#trace-background)"/>
    <circle cx="512" cy="445" r="405" fill="url(#trace-glow)"/>
    <circle cx="125" cy="150" r="82" fill="#8ec9d7" opacity=".18"/>
    <circle cx="887" cy="830" r="130" fill="#80ad89" opacity=".13"/>
    <image href="../../public/tracker-assets/trace-mascot.png" x="106" y="48" width="812" height="889" preserveAspectRatio="xMidYMid meet" filter="url(#trace-shadow)"/>
  </g>
</svg>
